[project]
name = "seedvr2_video_path_upscaler"
description = "Companion add-on for the main SeedVR2 ComfyUI nodes, providing a native file-backed video path"
version = "2.5.24"
authors = [
    {name = "numz"},
    {name = "adrientoupet"}
]
license = {file = "LICENSE"} 
classifiers = [
     "Operating System :: OS Independent"
]
dependencies = [
    "torch",
    "torchvision",
    "safetensors",
    "numpy",
    "tqdm",
    "psutil",
    "einops",
    "omegaconf>=2.3.0",
    "diffusers>=0.33.1",
    "peft>=0.17.0",
    "rotary_embedding_torch>=0.5.3",
    "opencv-python",
    "gguf",
    "matplotlib"
]

[project.urls]
Repository = "https://github.com/ethanfel/ComfyUI-SeedVR2_VideoPathUpscaler"
Documentation = "https://www.youtube.com/@AInVFX"
"Bug Tracker" = "https://github.com/ethanfel/ComfyUI-SeedVR2_VideoPathUpscaler/issues"
Forum = "https://github.com/ethanfel/ComfyUI-SeedVR2_VideoPathUpscaler/discussions"

[tool.comfy]
PublisherId = "ethanfel"
DisplayName = "ComfyUI-SeedVR2_VideoPathUpscaler"
Icon = "https://raw.githubusercontent.com/ethanfel/ComfyUI-SeedVR2_VideoPathUpscaler/refs/heads/main/docs/seedvr_logo.png"
